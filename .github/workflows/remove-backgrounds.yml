name: Create transparent brand PNGs
on:
  push:
    paths:
      - ".github/workflows/remove-backgrounds.yml"
      - "scripts/remove-backgrounds.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install "rembg[cpu]" pillow
      - name: Remove backgrounds and export PNG
        run: python scripts/remove-backgrounds.py
      - name: Commit transparent PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.png"
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add transparent PNG brand assets"
            git push
          fi
